name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Lua (syntax check only)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.4
      - name: Generated files, contrast targets and Lua syntax
        run: python3 scripts/build.py --check --lua
